name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.idea/**'
      - 'test/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Release the next version and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          if git tag --points-at "$GITHUB_SHA" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "$GITHUB_SHA is already released"
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="v$major.$minor.$patch"
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --generate-notes ${latest:+--notes-start-tag "$latest"}
          git tag --force "v$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/v$major"
          echo "Released $version and moved v$major to $GITHUB_SHA"
